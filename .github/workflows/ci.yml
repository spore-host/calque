name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go control plane: format gate, vet, and the full test suite. This job does NOT
  # install uv, so the pyast contract test self-skips here — that path is covered
  # (and REQUIRED to run) in the contract job below, so it's proven, not assumed.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt (fail on unformatted)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

  # -race variant of the full test suite (calque#159) — separate job so a
  # race failure's output doesn't get lost inside `go`'s own build/test
  # steps, and so this doesn't slow down the fast path when only that
  # matters. Particularly worthwhile as fleet/pool/session concurrency
  # grows.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: go test -race
        run: go test -race -count=1 ./...

  # Known-vulnerability scan (calque#159) — appropriate for a tool that
  # handles AWS credentials and launches cloud infrastructure.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Go idiom/correctness lint (calque#164) — unchecked error returns,
  # staticcheck-style issues, unused identifiers. Separate job (not folded
  # into `go` above) so a lint failure's output doesn't get lost in the
  # middle of build/test output, mirroring pyast-contract's own
  # separate-job pattern below.
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2

  # Python idiom/correctness lint (calque#164) — pyflakes-class checks
  # (unused imports, undefined names, etc.) on calque's own Python source.
  # Scoped via ruff.toml to exclude testdata/ and examples/, which hold
  # real third-party corpus scripts and deliberately-incomplete synthetic
  # fixtures — linting those would be permanent, correct-to-ignore noise.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: ruff check
        run: uvx ruff check .

  # Markdown link validation (calque#170) -- checks every relative link
  # across the repo's docs resolves to a real file. Added after a stale
  # doc pass found several docs describing already-closed issues/shipped
  # features as open gaps; broken relative links are the same class of
  # drift in miniature and are mechanically checkable, unlike prose
  # accuracy. Scoped to internal file links only (offline=true) --
  # external URLs aren't checked here to avoid flaky CI from rate limits
  # on hosts like GitHub itself.
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: lychee (internal links only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --include-fragments
            '*.md' 'docs/**/*.md' 'examples/**/*.md' 'assets/**/*.md'
          fail: true

  # Python <-> Go parser contract. The parser tests skip when uv is absent (see
  # internal/parse/parse_test.go); CI installs uv so they actually run, then asserts
  # they were NOT skipped — a silent skip here would hide contract drift.
  pyast-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: sync pyast deps
        working-directory: tools/pyast
        run: uv sync

      - name: run parser contract tests (must not skip)
        run: |
          # Run only the parse package verbosely; capture output to detect skips.
          go test -count=1 -v ./internal/parse/ | tee /tmp/parse.out
          if grep -q -- '--- SKIP' /tmp/parse.out; then
            echo "::error::a parser contract test SKIPPED with uv installed — the Go<->Python contract was not exercised"
            exit 1
          fi
