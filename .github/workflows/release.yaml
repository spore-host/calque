name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # keyless cosign signing (Fulcio/Rekor) + build provenance
  attestations: write   # actions/attest-build-provenance (SLSA)

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      # cosign for keyless artifact signing (the .goreleaser.yaml signs: block
      # invokes `cosign sign-blob --bundle` over checksums.txt using this
      # job's OIDC identity) -- matches spawn/truffle/lagotto's convention.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Full local verification gate before a tag ever reaches GoReleaser --
      # a release push may land on a commit ci.yml hasn't finished checking
      # yet (push and tag can race), so re-run the same checks here rather
      # than trusting the tag's commit already passed CI.
      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: sync pyast deps
        working-directory: tools/pyast
        run: uv sync

      - name: gofmt / vet / build / test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -count=1 ./...

      - name: ruff check
        run: uvx ruff check .

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      # SLSA build provenance for the release archives. Complements the
      # cosign signature: cosign authenticates the publisher, attestation
      # records how/where the artifacts were built. Attests checksums.txt
      # (covers every artifact by hash) so one attestation vouches for the
      # whole release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/checksums.txt'
