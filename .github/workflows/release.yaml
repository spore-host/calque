name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build/archive/checksum only via --snapshot --skip=sign,publish -- never creates a GitHub Release or pushes to homebrew-tap/scoop-bucket'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write   # keyless cosign signing (Fulcio/Rekor) + build provenance
  attestations: write   # actions/attest-build-provenance (SLSA)

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      # cosign for keyless artifact signing (the .goreleaser.yaml signs: block
      # invokes `cosign sign-blob --bundle` over checksums.txt using this
      # job's OIDC identity) -- matches spawn/truffle/lagotto's convention.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Full local verification gate before a tag ever reaches GoReleaser --
      # a release push may land on a commit ci.yml hasn't finished checking
      # yet (push and tag can race), so re-run the same checks here rather
      # than trusting the tag's commit already passed CI.
      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: sync pyast deps
        working-directory: tools/pyast
        run: uv sync

      - name: gofmt / vet / build / test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -count=1 ./...

      - name: ruff check
        run: uvx ruff check .

      # Real release ONLY on a `v*` tag push where dry_run wasn't explicitly
      # requested. A workflow_dispatch run defaults dry_run=true and this
      # condition is false for it either way (github.event_name != 'push'),
      # so a manual dispatch can never accidentally publish for real.
      - name: Run GoReleaser (release)
        if: github.event_name == 'push' && inputs.dry_run != true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      # Dry run (workflow_dispatch, or a manual re-run with dry_run=true):
      # build + archive + checksum only. --snapshot skips every git-tag
      # validation (so it runs on any commit, not just a real tag) and
      # --skip=sign,publish means NO cosign signing, NO GitHub Release, and
      # NO push to homebrew-tap/scoop-bucket -- confirms the build/archive
      # stages succeed in real CI without any public, hard-to-undo side
      # effect.
      - name: Run GoReleaser (dry run)
        if: github.event_name != 'push' || inputs.dry_run == true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the release archives -- real releases
      # only; a dry run's snapshot artifacts are throwaway and not worth
      # attesting. Complements the cosign signature: cosign authenticates
      # the publisher, attestation records how/where the artifacts were
      # built. Attests checksums.txt (covers every artifact by hash) so one
      # attestation vouches for the whole release.
      - name: Attest build provenance
        if: github.event_name == 'push' && inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/checksums.txt'

      # Surface the dry run's actual archive contents in the job log --
      # without this, a passing dry run only proves "goreleaser exited 0",
      # not "the archive layout is what we intended" (e.g. pyast/ actually
      # bundled correctly).
      - name: Show dry-run artifacts
        if: github.event_name != 'push' || inputs.dry_run == true
        run: |
          echo "### dist/ contents"
          find dist -maxdepth 1 -type f -o -maxdepth 1 -type d | sort
          echo
          echo "### one archive's contents (darwin/arm64)"
          tar -tzf dist/calque_*_darwin_arm64.tar.gz
